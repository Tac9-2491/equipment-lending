<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('css'); ?>
  <style>
    table.status { width: 100%; border-collapse: collapse; background: var(--card); }
    table.status th, table.status td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    table.status th { font-size: 13px; color: var(--muted); font-weight: 600; background: #f8fafc; white-space: nowrap; }
    table.status td.name a { font-weight: 700; text-decoration: none; }
    table.status tr.in-use td { background: #fffafa; }
    .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .summary { margin: 4px 0 12px; }

    /* スマホではカード表示 */
    @media (max-width: 640px) {
      table.status thead { display: none; }
      table.status, table.status tbody, table.status tr, table.status td { display: block; width: 100%; }
      table.status tr { border-bottom: 1px solid var(--border); padding: 10px 14px; }
      table.status td { border: none; padding: 2px 0; display: flex; gap: 12px; }
      table.status td::before { content: attr(data-label); color: var(--muted); font-size: 13px; min-width: 6.5em; }
      table.status td.name::before { display: none; }
      table.status td.name { font-size: 17px; justify-content: space-between; }
      table.status td.empty { display: none; }
    }
  </style>
</head>
<body>
  <header class="app"></header>
  <main id="app" class="wide"><div class="loading">読み込み中…</div></main>

  <script type="application/json" id="boot"><?!= bootJson ?></script>
  <?!= include('common_js'); ?>
  <script>
    const app = document.getElementById('app');
    const locationId = BOOT.params.loc || '';

    renderHeader();
    render(BOOT.data);

    function render(data) {
      if (!data || !data.ok) {
        app.innerHTML = '<div class="card"><div class="msg error">' + esc((data && data.message) || 'エラーが発生しました。') + '</div></div>';
        return;
      }
      const showLocation = !data.location;
      const inUseCount = data.rows.filter((r) => r.status.state === '使用中').length;

      let html =
        '<div class="row">' +
          '<h1>' + esc(data.location ? data.location.name : 'すべての機器') + '</h1>' +
          '<span class="spacer"></span>' +
          '<button class="small" id="reloadBtn">更新</button>' +
        '</div>' +
        '<div class="muted summary">全' + data.rows.length + '台　使用中 ' + inUseCount + '台　空き ' + (data.rows.length - inUseCount) + '台　（' + esc(data.updatedAt) + ' 時点）</div>';

      if (!data.rows.length) {
        html += '<div class="card muted">登録されている機器はありません。</div>';
      } else {
        html += '<div class="table-wrap"><table class="status"><thead><tr>' +
          '<th>機器名</th>' + (showLocation ? '<th>設置場所</th>' : '') +
          '<th>状態</th><th>使用者</th><th>使用開始日時</th><th>返却日時</th>' +
          '</tr></thead><tbody>';
        data.rows.forEach((r) => {
          const st = r.status;
          const inUse = st.state === '使用中';
          const cell = (label, value) => '<td data-label="' + label + '"' + (value ? '' : ' class="empty"') + '>' + esc(value) + '</td>';
          html += '<tr class="' + (inUse ? 'in-use' : '') + '">' +
            '<td class="name"><a href="' + esc(itemUrl(r.item.id)) + '">' + esc(r.item.name) + '</a></td>' +
            (showLocation ? cell('設置場所', r.item.locationName) : '') +
            '<td data-label="状態">' + stateBadge(st.state) + (inUse && st.elapsed ? ' <span class="muted">' + esc(st.elapsed) + '</span>' : '') + '</td>' +
            cell(inUse ? '使用者' : '前回の使用者', st.user) +
            cell('使用開始日時', st.startAt) +
            cell('返却日時', inUse ? '' : st.returnAt) +
            '</tr>';
        });
        html += '</tbody></table></div>';
      }
      app.innerHTML = html;
      document.getElementById('reloadBtn').addEventListener('click', reload);
    }

    async function reload() {
      try {
        const data = await withBusy('更新中…', () => callServer('apiGetList', locationId));
        render(data);
      } catch (err) {
        alertDialog('通信エラー：' + err.message);
      }
    }
  </script>
</body>
</html>
