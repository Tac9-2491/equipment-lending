<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('css'); ?>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .label {
      background: #fff; border: 1px dashed #b8c2cc; border-radius: 8px;
      padding: 12px; text-align: center; break-inside: avoid; page-break-inside: avoid;
    }
    .label .qr svg { width: 150px; height: 150px; display: block; margin: 0 auto; }
    .label .name { font-weight: 700; margin-top: 6px; line-height: 1.3; }
    .label .sub { font-size: 12px; color: var(--muted); }
    .label .url { font-size: 10px; color: var(--muted); word-break: break-all; margin-top: 4px; }
    .label.disabled { opacity: .45; }
    .options { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
    @media print {
      body { background: #fff; }
      header.app, .no-print { display: none !important; }
      main { max-width: none; padding: 0; }
      .labels { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .label.disabled { display: none; }
      body.hide-url .label .url { display: none; }
    }
  </style>
</head>
<body>
  <header class="app"></header>
  <main id="app" class="wide"><div class="loading">読み込み中…</div></main>

  <script type="application/json" id="boot"><?!= bootJson ?></script>
  <?!= include('common_js'); ?>
  <script>
    const app = document.getElementById('app');
    renderHeader();
    render(BOOT.data);

    function render(data) {
      if (!data || !data.ok) {
        app.innerHTML = '<div class="card"><div class="msg error">' + esc((data && data.message) || 'エラーが発生しました。') + '</div></div>';
        return;
      }
      app.innerHTML =
        '<div class="card no-print">' +
          '<h1>QRコード印刷</h1>' +
          '<p class="muted">機器と設置場所のQRコードです。ブラウザの印刷機能（Ctrl+P）で印刷し、切り取って貼ってください。無効の機器は印刷されません。</p>' +
          '<div class="options">' +
            '<label><input type="checkbox" id="optLoc" checked> 設置場所</label>' +
            '<label><input type="checkbox" id="optEq" checked> 機器</label>' +
            '<label><input type="checkbox" id="optUrl"> URLも印刷する</label>' +
          '</div>' +
          '<div class="row" style="margin-top:12px">' +
            '<button class="small" id="printBtn">印刷する</button>' +
            '<button class="small" id="writeBtn">URLをシートに書き出す</button>' +
          '</div>' +
        '</div>' +
        '<section id="secLoc"><h2>設置場所（状況一覧）</h2><div class="labels">' +
          (data.locations.length ? data.locations.map((l) => label(l.url, l.name, '設置場所 ' + l.id + '｜状況一覧', true)).join('') : '<p class="muted">設置場所マスタが空です。</p>') +
        '</div></section>' +
        '<section id="secEq"><h2>機器</h2><div class="labels">' +
          (data.equipment.length ? data.equipment.map((e) => label(e.url, e.name, e.id + (e.locationName ? '｜' + e.locationName : '') + (e.enabled ? '' : '｜無効'), e.enabled)).join('') : '<p class="muted">備品マスタが空です。</p>') +
        '</div></section>';

      document.querySelectorAll('.qr[data-url]').forEach((el) => { el.innerHTML = qrSvg(el.dataset.url); });
      document.getElementById('optLoc').addEventListener('change', (e) => { document.getElementById('secLoc').hidden = !e.target.checked; });
      document.getElementById('optEq').addEventListener('change', (e) => { document.getElementById('secEq').hidden = !e.target.checked; });
      const optUrl = document.getElementById('optUrl');
      const syncUrl = () => document.body.classList.toggle('hide-url', !optUrl.checked);
      optUrl.addEventListener('change', syncUrl);
      syncUrl();
      document.getElementById('printBtn').addEventListener('click', () => window.print());
      document.getElementById('writeBtn').addEventListener('click', writeUrls);
    }

    function label(url, name, sub, enabled) {
      return '<div class="label' + (enabled ? '' : ' disabled') + '">' +
        '<div class="qr" data-url="' + esc(url) + '"></div>' +
        '<div class="name">' + esc(name) + '</div>' +
        '<div class="sub">' + esc(sub) + '</div>' +
        '<div class="url">' + esc(url) + '</div>' +
      '</div>';
    }

    function qrSvg(url) {
      if (typeof qrcode !== 'function') return '<div class="muted">QRライブラリを読み込めませんでした</div>';
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    }

    async function writeUrls() {
      try {
        const res = await withBusy('書き出し中…', () => callServer('apiWriteUrls', BOOT.params.key));
        alertDialog(res.ok ? 'シートにURLを書き出しました（機器 ' + res.equipment + ' 件、設置場所 ' + res.locations + ' 件）。' : res.message);
      } catch (err) {
        alertDialog('通信エラー：' + err.message);
      }
    }
  </script>
</body>
</html>
